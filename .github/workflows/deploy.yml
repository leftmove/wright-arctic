name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the Python Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned native codec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leftmove/wright-pacific
          ref: 1cfa2f501e8f9a57865152ce869da93c74024b9b
          token: ${{ secrets.WRIGHT_NATIVE_READ_TOKEN }}
          path: .native-codec
          persist-credentials: false
      - name: Use the verified codec checkout for Cargo
        run: git config --global url."file://${GITHUB_WORKSPACE}/.native-codec".insteadOf https://github.com/leftmove/wright-pacific.git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        working-directory: engine
        run: rustup show
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Prepare the WebAssembly toolchain
        run: make worker-setup
      - name: Build the PyEmscripten wheel and Worker bundle
        run: make worker-build
      - name: Check that this is still the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Deploy the validated bundle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: make worker-deploy
      - name: Verify the deployed runtime and bindings
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 https://wright-arctic.anonyo.workers.dev/health
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 https://wright-arctic.anonyo.workers.dev/hello
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 https://wright-arctic.anonyo.workers.dev/ready
