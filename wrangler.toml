name = "wright-arctic"
main = "src/app/worker.py"
base_dir = "src"
compatibility_date = "2026-11-08"
compatibility_flags = ["python_workers", "python_shared_standard_library"]

[python_modules]
exclude = [
    "**/*.pyc",
    "**/__pycache__/**",
]

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "wright-documents"
remote = true

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "wright-images"
remote = true

[[rules]]
type = "Text"
globs = ["app/assets/prompts/*.md"]
fallthrough = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e1a6b6e97a3f492a8a285b308ee910ad"

[placement]
mode = "smart"

[observability]
enabled = true

# Cleanup is bounded to sixteen exact-key deletions per invocation.
[triggers]
crons = ["*/5 * * * *"]
