[project]
name = "wright-arctic"
version = "0.1.0"
description = "Platform for Wright."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.146.0,<1",
    "pillow>=13,<14",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "wright-arctic-engine",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114,<2",
    "maturin>=1.15.0,<2",
    "mypy>=2.4.0,<3",
    "ruff>=0.17.1,<0.18",
]

[tool.uv]
package = false
required-version = ">=0.13.1"

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
wright-arctic-engine = { workspace = true }

[tool.fastapi]
entrypoint = "app.main:app"

[tool.mypy]
files = ["app", "engine/python/engine"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/engine/python"]
explicit_package_bases = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py314"
src = ["app", "engine/python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Native stubs carry Rust docstrings so editors can show API documentation.
"_core.pyi" = ["PYI021"]
