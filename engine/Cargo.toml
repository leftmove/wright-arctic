[package]
name = "wright-arctic-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Typed native engine for Wright Arctic."
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
stubgen = ["dep:pyo3-stub-gen"]

[dependencies]
pyo3 = "0.29.3"
pyo3-stub-gen = { version = "0.23.1", optional = true }
wright-crdt = { git = "https://github.com/leftmove/wright-pacific.git", rev = "e7b66ef489af24e7c089d9cb13b8545b051abbc8" }
wright-document = { git = "https://github.com/leftmove/wright-pacific.git", rev = "e7b66ef489af24e7c089d9cb13b8545b051abbc8" }
wright-model = { git = "https://github.com/leftmove/wright-pacific.git", rev = "e7b66ef489af24e7c089d9cb13b8545b051abbc8" }
wright-rich-text = { git = "https://github.com/leftmove/wright-pacific.git", rev = "e7b66ef489af24e7c089d9cb13b8545b051abbc8" }
wright-state = { git = "https://github.com/leftmove/wright-pacific.git", rev = "e7b66ef489af24e7c089d9cb13b8545b051abbc8" }
yrs = "=0.25.0"
serde_json = "1"

[[bin]]
name = "generate_stubs"
required-features = ["stubgen"]
test = false
bench = false

[lints.rust]
unsafe_code = "forbid"
